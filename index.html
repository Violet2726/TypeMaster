<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TypeMaster - 一个简约、可定制的打字测试应用，帮助你提升打字速度和准确率">
  <title>TypeMaster | 打字测试</title>

  <!-- 引用 Google Fonts (Roboto Mono 字体) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">

  <!-- 引入样式表 -->
  <link rel="stylesheet" href="index.css">
</head>

<body>
  <!-- ===============================
       顶部导航栏 (Header)
       包含 Logo 和 设置按钮
       =============================== -->
  <header>
    <div class="container">
      <div class="header-content">
        <a href="#" class="logo">
          <span class="logo-icon">⌨</span>
          type<span>master</span>
        </a>
        <nav class="nav-icons">
          <!-- 预留的主题切换和设置按钮 -->
          <button class="nav-icon" id="theme-toggle" title="切换主题">🎨</button>
          <button class="nav-icon" id="settings-btn" title="设置">⚙️</button>
        </nav>
      </div>
    </div>
  </header>

  <!-- ===============================
       主内容区域 (Main Content)
       =============================== -->
  <main>
    <div class="container">
      <!-- 
        1. 测试配置栏 (Config Bar) 
        允许用户选择标点、数字、模式(时间/单词)以及时长/词数
      -->
      <div class="config-bar">
        <!-- 模式开关 (标点/数字/AI) -->
        <div class="config-group">
          <button class="config-btn" data-mode="punctuation" title="标点符号">@ 标点</button>
          <button class="config-btn" data-mode="numbers" title="数字"># 数字</button>
          <button class="config-btn" id="ai-mode-btn" title="AI Generate">🤖 AI生成</button>
        </div>

        <div class="config-separator"></div>

        <!-- 测试类型 (时间/单词) -->
        <div class="config-group">
          <button class="config-btn active" data-type="time" title="按时间测试">⏱ 时间</button>
          <button class="config-btn" data-type="words" title="按单词数测试">📝 单词</button>
        </div>

        <div class="config-separator"></div>

        <!-- 时间选项 (15/30/60/120秒) -->
        <div class="config-group" id="time-options">
          <button class="config-btn" data-value="15">15</button>
          <button class="config-btn active" data-value="30">30</button>
          <button class="config-btn" data-value="60">60</button>
          <button class="config-btn" data-value="120">120</button>
        </div>

        <!-- 单词数选项 (默认隐藏) -->
        <div class="config-group hidden" id="words-options">
          <button class="config-btn" data-value="10">~10</button>
          <button class="config-btn active" data-value="25">~25</button>
          <button class="config-btn" data-value="50">~50</button>
          <button class="config-btn" data-value="100">~100</button>
        </div>
      </div>

      <!-- 
        2. 打字测试核心区域 (Typing Test Section) 
      -->
      <section class="typing-test" id="typing-test">
        <!-- 实时数据统计 (WPM / 准确率 / 倒计时) -->
        <div class="live-stats">
          <div class="live-stat">
            <span class="live-stat-value" id="live-wpm">0</span>
            <span class="live-stat-label">wpm</span>
          </div>
          <div class="live-stat">
            <span class="live-stat-value" id="live-accuracy">100</span>
            <span class="live-stat-label">%</span>
          </div>
          <div class="live-stat">
            <span class="live-stat-value" id="live-timer">30</span>
            <span class="live-stat-label" id="timer-label">秒</span>
          </div>
        </div>

        <!-- 单词显示容器 -->
        <div class="words-container" id="words-container">
          <div class="words-wrapper" id="words-wrapper">
            <!-- 光标 (跟随 active 状态闪烁/移动) -->
            <div class="caret" id="caret"></div>
            <!-- 单词列表 (由 JS 动态生成) -->
            <div class="words" id="words"></div>
          </div>

          <!-- 聚焦提示遮罩层 (失焦时显示) -->
          <div class="focus-overlay" id="focus-overlay">
            点击此处开始打字
          </div>
        </div>

        <!-- 
          隐藏输入框 (Hidden Input)
          用于捕获移动端和桌面端的键盘输入，保持在视口外或透明
        -->
        <input type="text" class="hidden-input" id="hidden-input" autocomplete="off" autocapitalize="off"
          autocorrect="off" spellcheck="false">
      </section>

      <!-- 
        3. 结果结算面板 (Results Section) 
        测试结束后显示，包含大图表和详细数据
      -->
      <section class="results" id="results">
        <!-- 结果顶部：左侧数据 + 右侧图表 -->
        <div class="results-header">
          <!-- 核心数据 (WPM/Acc) -->
          <div class="results-stats">
            <div class="result-big">
              <span class="result-label">wpm</span>
              <span class="result-value" id="result-wpm">0</span>
            </div>
            <div class="result-big">
              <span class="result-label">acc</span>
              <span class="result-value" id="result-accuracy">0<span class="result-unit">%</span></span>
            </div>
          </div>

          <!-- 速度变化趋势图表 (Canvas) -->
          <div class="chart-container" id="chart-container">
            <canvas id="wpm-chart" class="chart-canvas"></canvas>

            <!-- 图表悬浮提示框 -->
            <div class="chart-tooltip" id="chart-tooltip">
              <div class="tooltip-time"></div>
              <div class="tooltip-row"><span class="tooltip-color errors"></span>errors: <span
                  class="tooltip-errors">0</span></div>
              <div class="tooltip-row"><span class="tooltip-color wpm"></span>wpm: <span class="tooltip-wpm">0</span>
              </div>
              <div class="tooltip-row"><span class="tooltip-color raw"></span>raw: <span class="tooltip-raw">0</span>
              </div>
              <div class="tooltip-row"><span class="tooltip-color burst"></span>burst: <span
                  class="tooltip-burst">0</span>
              </div>
            </div>

            <!-- 图例 -->
            <div class="chart-legend">
              <div class="legend-item">
                <span class="legend-color wpm"></span>
                <span>wpm</span>
              </div>
              <div class="legend-item">
                <span class="legend-color raw"></span>
                <span>raw</span>
              </div>
              <div class="legend-item">
                <span class="legend-color burst"></span>
                <span>burst</span>
              </div>
              <div class="legend-item">
                <span class="legend-color errors"></span>
                <span>errors</span>
              </div>
            </div>
          </div>
        </div>

        <!-- 详细数据网格 -->
        <div class="results-details">
          <div class="result-item">
            <span class="result-item-label">test type</span>
            <span class="result-item-value" id="result-test-type">time 30</span>
          </div>
          <div class="result-item">
            <span class="result-item-label">raw</span>
            <span class="result-item-value" id="result-raw-wpm">0</span>
          </div>
          <div class="result-item">
            <span class="result-item-label">characters</span>
            <span class="result-item-value">
              <span class="correct" id="result-correct">0</span>/<span class="incorrect"
                id="result-incorrect">0</span>/<span id="result-extra">0</span>/<span id="result-missed">0</span>
            </span>
          </div>
          <div class="result-item">
            <span class="result-item-label">consistency</span>
            <span class="result-item-value" id="result-consistency">0%</span>
          </div>
          <div class="result-item">
            <span class="result-item-label">time</span>
            <span class="result-item-value" id="result-time">0s</span>
          </div>
        </div>

        <!-- 操作按钮 (重试/下一步) -->
        <div class="results-actions">
          <button class="action-btn primary" id="restart-btn">
            🔄 重新开始
          </button>
          <button class="action-btn" id="next-test-btn">
            ➡️ 新测试
          </button>
        </div>
      </section>
    </div>
  </main>

  <!-- ===============================
       底部页脚 (Footer)
       显示快捷键提示和版本信息
       =============================== -->
  <footer>
    <div class="container">
      <div class="footer-content">
        <div class="shortcuts">
          <div class="shortcut">
            <span class="key">tab</span>
            <span>+</span>
            <span class="key">enter</span>
            <span>- 重新开始</span>
          </div>
          <div class="shortcut">
            <span class="key">esc</span>
            <span>- 重置</span>
          </div>
        </div>
        <div class="footer-links">
          <span class="text-sub">TypeMaster v1.0</span>
        </div>
      </div>
    </div>
  </footer>

  <!-- 引入主程序脚本 -->
  <script src="app.js"></script>
</body>

</html>
